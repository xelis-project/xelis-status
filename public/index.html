<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Node Status · Xelis</title>
  <meta name="description" content="Live status and latency of the official Xelis seed nodes." />
  <meta name="theme-color" content="#020708" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="site">
      <a class="logo" href="/">
        <svg viewBox="0 0 778 743" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M388.909 742.872L777.817 353.964L424.056 0.202599L478.809 132.737L700.036 353.964L388.909 665.091L77.7817 353.964L299.507 129.121L353.964 0L0 353.964L388.909 742.872Z"/><path d="M388.909 665.091L353.964 0L299.507 129.121L388.909 665.091Z"/><path d="M424.056 0.202599L388.909 665.091L478.809 132.737L424.056 0.202599Z"/></svg>
        <span>XELIS&nbsp;<span class="mint">STATUS</span></span>
      </a>
      <nav>
        <a href="#nodes" class="active">Seed Nodes</a>
        <a href="https://xelis.io" target="_blank" rel="noopener">Website</a>
        <a href="https://explorer.xelis.io" target="_blank" rel="noopener">Explorer</a>
      </nav>
      <div class="status connecting" id="net-status" role="status" aria-live="polite">
        <span class="dot"></span>
        <span id="net-label">connecting</span>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1>Node Status</h1>
        <div class="overall" id="overall" data-state="waiting">
          <span class="dot"></span>
          <span id="overall-label">Checking nodes</span>
        </div>
      </section>

      <section id="nodes" class="section">
        <div class="section-head">
          <h2>Seed Nodes</h2>
          <span class="count" id="node-count">2 endpoints</span>
        </div>
        <div class="node-grid" id="node-grid"></div>
      </section>
    </main>

    <footer class="site">
      <a class="footer-brand" href="/">
        <svg viewBox="0 0 778 743" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M388.909 742.872L777.817 353.964L424.056 0.202599L478.809 132.737L700.036 353.964L388.909 665.091L77.7817 353.964L299.507 129.121L353.964 0L0 353.964L388.909 742.872Z"/><path d="M388.909 665.091L353.964 0L299.507 129.121L388.909 665.091Z"/><path d="M424.056 0.202599L388.909 665.091L478.809 132.737L424.056 0.202599Z"/></svg>
        <span>XELIS&nbsp;<span class="mint">STATUS</span></span>
      </a>
      <nav class="footer-links">
        <a href="https://xelis.io" target="_blank" rel="noopener">Website</a>
        <a href="https://explorer.xelis.io" target="_blank" rel="noopener">Explorer</a>
        <a href="https://discord.gg/xelis" target="_blank" rel="noopener">Discord</a>
      </nav>
      <div class="footer-copy">© <span id="year"></span> Xelis · Seed node health</div>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
